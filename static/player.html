<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; frame-src 'self' https://www.youtube.com; style-src 'self' 'unsafe-inline';">
    <title>LA CANTA QUE RANA - Reproductor</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --primary-color: #4CAF50;
            --surface-color: rgba(18, 18, 18, 0.85);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #background-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* Detrás de todo */
            background-image: url('/static/player_background.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-color: var(--bg-color);
            transition: opacity 1.5s ease-in-out;
            opacity: 0;
        }

        #background-carousel.active {
            opacity: 1;
        }

        #background-carousel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            /* Encima del carrusel */
        }

        #standby-screen {
            position: relative;
            z-index: 5;
            /* Encima de todo cuando está activo */
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease-in-out;
            background-color: transparent;
            /* El fondo lo da el carrusel */
        }

        h1 {
            font-size: 4vw;
            color: var(--primary-color);
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            margin-top: 0;
        }

        p {
            font-size: 2vw;
            text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.7);
        }

        /* --- Overlay informativo --- */
        .info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 20;
            /* Encima del reproductor */
            display: flex;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.6) 40%, rgba(0, 0, 0, 0) 100%);
            padding: 10px 40px;
            /* Reducido el padding vertical */
            box-sizing: border-box;
            transition: opacity 0.5s ease-in-out;
        }

        .info-section {
            flex: 1;
            padding: 0 20px;
            /* Mantenemos el padding horizontal */
        }

        .info-section:first-child {
            border-right: 2px solid rgba(255, 255, 255, 0.2);
        }

        .info-section h2 {
            font-size: 1.2vw;
            /* Reducido */
            margin-top: 0;
            margin-bottom: 5px;
            /* Reducido */
            color: var(--primary-color);
            text-shadow: 2px 2px 4px #000;
        }

        .info-title {
            font-size: 1.5vw;
            /* Reducido */
            font-weight: bold;
            margin-bottom: 5px;
        }

        .info-artist {
            font-size: 1vw;
            color: #ccc;
        }

        /* --- Reacciones --- */
        .reaction-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 9999;
        }

        .reaction-emoji {
            position: absolute;
            bottom: -100px;
            font-size: 5rem;
            animation: float-up 6s ease-out forwards;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.8);
        }

        @keyframes float-up {
            to {
                bottom: 100%;
                transform: translateX(var(--tx, 0)) scale(1.5);
                opacity: 0;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        /* --- Banner de Notificaciones Globales --- */
        #notification-banner {
            position: fixed;
            top: -150px;
            /* Empieza fuera de la pantalla */
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 1200px;
            background-color: var(--primary-color);
            color: var(--text-color);
            text-align: center;
            padding: 20px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            z-index: 9000;
            font-size: 2.5vw;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);
            transition: top 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        #notification-banner.show {
            top: 0;
        }
    </style>
</head>

<body>
    <div id="background-carousel"></div>

    <div id="standby-screen">
        <h1>LA CANTA QUE RANA</h1>
        <p>Esperando la siguiente canción...</p>
    </div>

    <div id="player-container"></div>



    <div class="info-overlay" id="info-overlay">
        <div class="info-section">
            <h2>Ahora Cantando</h2>
            <div id="now-playing-info">
                <div class="info-title">Esperando canción...</div>
                <div class="info-artist"></div>
            </div>
        </div>
        <div class="info-section">
            <h2>Siguiente</h2>
            <div id="upcoming-info">
                <div class="info-title">No hay canciones en espera</div>
                <div class="info-artist"></div>
            </div>
        </div>
    </div>

    <!-- Banner para mensajes globales -->
    <div id="notification-banner"></div>

    <div id="reaction-container" class="reaction-container"></div>

    <script>
        // Cargar YouTube IFrame API para control programático
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Variable global para el reproductor de YouTube
        var ytPlayer = null;

        // Callback cuando la API está lista
        function onYouTubeIframeAPIReady() {
            console.log("✅ YouTube IFrame API lista y cargada");
        }
    </script>
    <script>
        // Usar WebSocket URL relativa para funcionar tanto en HTTP como HTTPS
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WEBSOCKET_URL = `${wsProtocol}//${window.location.host}/ws/cola`;
        const API_BASE_URL = `${window.location.protocol}//${window.location.host}/api/v1`;
        let standbyScreen = document.getElementById('standby-screen');
        let backgroundCarousel = document.getElementById('background-carousel');
        let infoOverlay = document.getElementById('info-overlay');
        let notificationBanner = document.getElementById('notification-banner');

        // Variables para el autoplay automático
        let autoplayTimer = null;
        let transitionInProgress = false;
        let currentSongEnded = false;

        // Flags para acciones enviadas por admin antes de que el reproductor exista
        let pendingPause = false;
        let pendingResume = false;

        // Variables para rastrear el video actual (necesarias para reiniciar)
        let currentVideoId = null;
        let currentVideoDuration = 0;
        let nextSongInfo = null; // Información de la siguiente canción para mostrar en transición
        let lastSongScore = null; // Información del puntaje de la última canción

        // Variables para rastrear si el reproductor está reproduciendo
        let isPlayerPlaying = false;

        // Variables para sincronizar la transición con el puntaje
        let scoreReadyForTransition = false;
        let pendingTransition = false;
        let transitionTimeout = null;

        // (Pre-carga deshabilitada) -- anteriormente había lógica para pre-cargar

        // --- Lógica del Carrusel de Fondos ---
        const backgroundImages = [];
        let currentImageIndex = 0;
        let carouselInterval;

        function changeBackgroundImage() {
            // El fondo se manejará con imagen local en su lugar
        }

        function startCarousel() {
            if (carouselInterval) return; // Ya está corriendo
            standbyScreen.style.opacity = '1';
            infoOverlay.style.opacity = '0';
            backgroundCarousel.classList.add('active');


        }

        function stopCarousel() {
            standbyScreen.style.opacity = '0';
            infoOverlay.style.opacity = '1';
            clearInterval(carouselInterval);
            carouselInterval = null;
            backgroundCarousel.classList.remove('active');


        }

        // Función para crear el reproductor de YouTube con la API
        function createYouTubePlayer(videoId) {
            const container = document.getElementById('player-container');
            if (!container) {
                console.error('player-container not found in DOM');
                return;
            }

            // Limpiar contenedor y crear div para el reproductor
            container.innerHTML = '<div id="youtube-iframe"></div>';

            // Crear reproductor con YouTube IFrame API
            ytPlayer = new YT.Player('youtube-iframe', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'iv_load_policy': 3,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });

            console.log('✅ Reproductor de YouTube creado con API para video:', videoId);
        }

        // Evento cuando el reproductor está listo
        function onPlayerReady(event) {
            console.log('✅ Reproductor listo, iniciando reproducción');
            // Iniciamos por defecto
            event.target.playVideo();

            // Aplicar acciones encoladas por admin si las hubiera
            try {
                if (pendingPause) {
                    if (typeof event.target.pauseVideo === 'function') {
                        event.target.pauseVideo();
                        console.log('⏸️ Aplicando pausa encolada por admin');
                    }
                    pendingPause = false;
                } else if (pendingResume) {
                    if (typeof event.target.playVideo === 'function') {
                        event.target.playVideo();
                        console.log('▶️ Aplicando reanudar encolado por admin');
                    }
                    pendingResume = false;
                }
            } catch (e) {
                console.warn('⚠️ Error aplicando acción encolada:', e);
                pendingPause = false;
                pendingResume = false;
            }
        }

        // Evento cuando cambia el estado del reproductor
        function onPlayerStateChange(event) {
            // YT.PlayerState.PLAYING = 1
            // YT.PlayerState.PAUSED = 2
            // YT.PlayerState.BUFFERING = 3
            // YT.PlayerState.CUED = 5
            // YT.PlayerState.ENDED = 0

            if (event.data === YT.PlayerState.PLAYING) {
                console.log('▶️ Video reproduciéndose');
                isPlayerPlaying = true;
                currentSongEnded = false;

                // Cancelar cualquier timer de transición si estaba corriendo
                if (autoplayTimer) {
                    clearTimeout(autoplayTimer);
                    autoplayTimer = null;
                    console.log('🔄 Timer de transición cancelado (video comenzó a reproducirse)');
                }
            } else if (event.data === YT.PlayerState.PAUSED) {
                console.log('⏸️ Video pausado');
                isPlayerPlaying = false;
            } else if (event.data === YT.PlayerState.ENDED) {
                console.log('🎬 Video terminado, solicitando avance de cola...');
                isPlayerPlaying = false;
                currentSongEnded = true;

                // Cancelar timer de fallback si estaba corriendo
                if (autoplayTimer) {
                    clearTimeout(autoplayTimer);
                    autoplayTimer = null;
                }

                // Llamar a advanceToNextSong inmediatamente
                // Esto hará que el backend envíe song_finished con el puntaje
                if (!transitionInProgress) {
                    advanceToNextSong();
                }
            }
        }

        // Mostrar pantalla de transición entre canciones
        function showTransitionScreen() {
            if (transitionInProgress) {
                console.log('⚠️ Transición ya en progreso, ignorando nueva solicitud');
                return;
            }

            transitionInProgress = true;
            pendingTransition = false; // Ya no está pendiente
            console.log('🔄 Iniciando transición a siguiente canción');
            console.log('📊 Datos de puntaje disponibles:', lastSongScore);

            // Limpiar el reproductor
            const container = document.getElementById('player-container');
            if (container) {
                container.innerHTML = '';
            }

            // Mostrar pantalla de espera con fondo
            startCarousel();

            // Construir el HTML de la pantalla de transición
            const standbyParagraph = standbyScreen.querySelector('p');

            let transitionHTML = '';

            // 1. Mostrar puntaje si fue una canción karaoke
            if (lastSongScore) {
                transitionHTML += `
                    <div style="margin-bottom: 20px; text-align: center;">
                        <div style="font-size: 5rem; margin-bottom: 15px;">🐸 LA CANTA QUE RANA 🐸</div>
                        <div style="font-size: 4.5rem; margin-bottom: 10px; animation: pulse 1s infinite;">🎤</div>
                `;

                if (lastSongScore.is_karaoke) {
                    // Mostrar puntaje para karaoke
                    if (lastSongScore.puntuacion_ia > 0) {
                        transitionHTML += `
                            <p style="font-size: 1.1em; color: #FFD700; margin: 10px 0;">
                                ¡Felicitaciones, <strong>${lastSongScore.usuario_nick}</strong>!
                            </p>
                            <p style="font-size: 2.8em; color: #4CAF50; margin: 5px 0; font-weight: bold;">
                                ✨ ${lastSongScore.puntuacion_ia} PUNTOS ✨
                            </p>
                            <p style="font-size: 1.1em; color: #FFD700; margin: 5px 0;">
                                ¡Sigue así! 🎉
                            </p>
                        `;
                    } else {
                        transitionHTML += `
                            <p style="font-size: 1.2em; color: #888; margin: 10px 0;">
                                Nadie cantó la última canción.
                            </p>
                            <p style="font-size: 2em; color: #666; margin: 5px 0;">
                                Puntaje: 0
                            </p>
                        `;
                    }
                } else {
                    // Modo escuchar
                    transitionHTML += `
                        <p style="font-size: 1.2em; color: #b0b0b0; margin: 10px 0;">
                            Gracias por escuchar:
                        </p>
                        <p style="font-size: 1.5em; color: #fff; font-weight: bold; margin: 5px 0;">
                            ${lastSongScore.titulo}
                        </p>
                    `;
                }

                transitionHTML += `</div>`;
            }

            // 2. Mostrar información de la siguiente canción
            if (nextSongInfo) {
                transitionHTML += `
                    <div style="margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 10px;">
                        <strong style="color: #4CAF50; font-size: 1.1em;">Próxima canción:</strong><br><br>
                        <span style="font-size: 1.8em; color: #fff;">${nextSongInfo.titulo}</span><br>
                        <span style="font-size: 1.1em; color: #b0b0b0;">Por: ${nextSongInfo.cantante}</span><br><br>
                        <span style="font-size: 1em; color: #4CAF50; animation: pulse 1s infinite;">
                            ⏱️ Comenzando en 5 segundos...
                        </span>
                    </div>
                `;
            } else {
                transitionHTML += `
                    <div style="font-size: 1.2em; color: #888;">
                        Cargando siguiente canción...
                    </div>
                `;
            }

            standbyParagraph.innerHTML = transitionHTML;

            // NO llamamos a advanceToNextSong aquí porque ya fue llamado antes
            // La siguiente canción comenzará automáticamente cuando llegue el evento play_song
        }

        // Función para avanzar automáticamente a la siguiente canción
        async function advanceToNextSong() {
            console.log('⏭️ Avanzando automáticamente a la siguiente canción...');

            // Marcar que estamos esperando la transición
            pendingTransition = true;

            try {
                const response = await fetch(`${API_BASE_URL}/canciones/siguiente`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.status === 204) {
                    console.log('✅ No hay más canciones en la cola (204 No Content)');
                    const container = document.getElementById('player-container');
                    if (container) container.innerHTML = '';
                    startCarousel();
                    transitionInProgress = false;
                    pendingTransition = false;

                    // Limpiar cualquier timer restante
                    if (autoplayTimer) {
                        clearTimeout(autoplayTimer);
                        autoplayTimer = null;
                    }
                    return;
                }

                if (response.ok) {
                    console.log('✅ Solicitud de avance exitosa, esperando eventos WebSocket...');

                    // Esperar a que llegue el evento song_finished con el puntaje
                    // Si no llega en 2 segundos, mostrar transición de todas formas
                    if (!scoreReadyForTransition) {
                        console.log('⏳ Esperando evento song_finished con puntaje...');
                        transitionTimeout = setTimeout(() => {
                            console.log('⚠️ Timeout: Mostrando transición sin puntaje');
                            if (pendingTransition && !transitionInProgress) {
                                showTransitionScreen();
                            }
                        }, 2000);
                    } else {
                        // El puntaje ya está listo, mostrar transición
                        console.log('✅ Puntaje ya disponible, mostrando transición');
                        showTransitionScreen();
                    }

                    // La siguiente canción comenzará automáticamente cuando llegue play_song
                } else {
                    console.error('❌ Error al avanzar:', response.status, response.statusText);
                    transitionInProgress = false;
                    pendingTransition = false;

                    // Intentar recuperarse mostrando la cola nuevamente
                    setTimeout(() => {
                        fetchAndUpdateQueue();
                    }, 2000);
                }
            } catch (error) {
                console.error('❌ Error en advanceToNextSong:', error);
                transitionInProgress = false;
                pendingTransition = false;

                // Intenta recuperarse
                setTimeout(() => {
                    try {
                        fetchAndUpdateQueue();
                    } catch (e) {
                        console.error('❌ Error recuperándose en advanceToNextSong:', e);
                    }
                }, 2000);
            }
        }

        function playVideo(videoId, duration = 0) {
            console.log('🎵 playVideo called with:', videoId, 'duration:', duration, 'seconds');

            // Guardar el video actual para poder reiniciarlo
            currentVideoId = videoId;
            currentVideoDuration = duration;
            currentSongEnded = false;
            isPlayerPlaying = false;

            // Resetear el puntaje anterior cuando comienza una nueva canción
            lastSongScore = null;
            scoreReadyForTransition = false;
            pendingTransition = false;

            // Limpiar timeout de transición si existe
            if (transitionTimeout) {
                clearTimeout(transitionTimeout);
                transitionTimeout = null;
            }

            // Limpiar temporizador anterior si existe
            if (autoplayTimer) {
                clearTimeout(autoplayTimer);
                autoplayTimer = null;
                console.log('🔄 Temporizador anterior limpiado');
            }

            stopCarousel(); // Oculta standby, muestra overlay y detiene carrusel

            try {
                // Verificamos si el iframe realmente existe (puede haber sido borrado por la transición)
                const iframeExists = document.getElementById('youtube-iframe');

                // Si el reproductor ya existe y el iframe está en el DOM, cargar el nuevo video
                if (ytPlayer && ytPlayer.loadVideoById && iframeExists) {
                    console.log('🔄 Cargando nuevo video en reproductor existente');
                    ytPlayer.loadVideoById(videoId);
                } else {
                    // Crear nuevo reproductor (el contenedor fue limpiado o es la primera carga)
                    console.log('🆕 Creando nuevo reproductor');
                    createYouTubePlayer(videoId);
                }

                // NUEVO: Establecer temporizador de fallback basado en la duración del video
                // Si el evento ENDED no se dispara, este timer forzará el avance a la siguiente canción
                if (duration > 0) {
                    // Añadir 2 segundos de buffer para seguridad
                    const fallbackTimeMs = (duration + 2) * 1000;
                    console.log(`⏱️ Temporizador de fallback establecido para ${duration + 2} segundos (${fallbackTimeMs}ms)`);

                    autoplayTimer = setTimeout(() => {
                        console.log('⚠️ FALLBACK TIMER ACTIVADO: El evento ENDED no se disparó, forzando transición');
                        autoplayTimer = null;

                        // Evitar múltiples transiciones simultáneas
                        if (!transitionInProgress) {
                            showTransitionScreen();
                        }
                    }, fallbackTimeMs);
                } else {
                    console.log('⚠️ No se estableció timer de fallback (duración desconocida)');
                }
            } catch (error) {
                console.error('❌ Error en playVideo:', error);
                // Intenta al menos mostrar la pantalla de transición para recuperarse
                setTimeout(() => {
                    if (!transitionInProgress) {
                        showTransitionScreen();
                    }
                }, 10000);
            }
        }

        // Pre-carga totalmente eliminada: no existe handleFiftyPercentPreLoad

        // Función para obtener y actualizar la cola inicial
        async function fetchAndUpdateQueue() {
            try {
                const response = await fetch(`${API_BASE_URL}/canciones/cola/extended`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    const data = await response.json();
                    console.log('📋 Cola inicial cargada:', data);
                    updateQueueUI(data);

                    // Auto-play: sincronizar reproductor con la canción actual si existe.
                    if (data.now_playing && data.now_playing.youtube_id) {
                        // Si no hay video cargado o el video actual es distinto, iniciar reproducción automáticamente
                        if (!currentVideoId || currentVideoId !== data.now_playing.youtube_id) {
                            console.log('🔄 Sincronizando reproductor con canción actual:', data.now_playing.titulo);
                            playVideo(data.now_playing.youtube_id, data.now_playing.duracion_seconds || 0);
                        } else {
                            console.log('🔁 Reproductor ya sincronizado con la canción actual:', data.now_playing.youtube_id);
                        }
                    }
                }
            } catch (err) {
                console.warn('⚠️ Error cargando cola inicial:', err);
            }
        }

        // 3. Conexión WebSocket para recibir órdenes
        function connectWebSocket() {
            console.log('Intentando conectar a WebSocket:', WEBSOCKET_URL);
            let socket = new WebSocket(WEBSOCKET_URL);

            socket.onopen = () => {
                console.log('WebSocket conectado exitosamente');
                // Obtener la cola inicial al conectar
                fetchAndUpdateQueue();
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Mensaje WebSocket recibido:', data);

                // 1. Reiniciar canción (Prioridad alta - Detiene el flujo si se ejecuta)
                if (data.type === 'restart_song') {
                    console.log('🔄 Recibida orden de reiniciar canción');
                    if (currentVideoId) {
                        console.log(`🔄 Reiniciando video: ${currentVideoId}`);
                        playVideo(currentVideoId, currentVideoDuration);
                    } else {
                        console.warn('⚠️ No hay video actual para reiniciar');
                    }
                    return; // Importante: Evita que se evalúen otros bloques
                }

                // 2. Reproducir canción
                if (data.type === 'play_song' && data.payload) {
                    // Soportar tanto youtube_id como youtube_url
                    let videoId = data.payload.youtube_id;

                    if (!videoId && data.payload.youtube_url) {
                        // Extraer el ID de la URL si es necesario
                        const match = data.payload.youtube_url.match(/\/embed\/([a-zA-Z0-9_-]+)/);
                        videoId = match ? match[1] : null;
                    }

                    if (videoId) {
                        console.log('▶️ Recibida orden de reproducir:', videoId);
                        const duration = data.payload.duracion_seconds || data.payload.duration || 0;
                        transitionInProgress = false;  // Marcar que salimos de transición
                        playVideo(videoId, duration);

                        // Forzar actualización de la cola inmediatamente para sincronizar el título/artista
                        // Esto evita que el player quede mostrando metadatos antiguos si el evento de
                        // actualización de la cola no llega o llega después del evento play_song.
                        try {
                            fetchAndUpdateQueue();
                        } catch (e) {
                            console.warn('⚠️ No se pudo actualizar la cola tras play_song:', e);
                        }
                    } else {
                        console.error('❌ No se pudo extraer el ID de YouTube:', data.payload);
                    }
                }

                // 3. Canción finalizada
                if (data.type === 'song_finished' && data.payload) {
                    const scoreInfo = data.payload;

                    // Guardar información del puntaje para mostrar en transición
                    lastSongScore = {
                        usuario_nick: scoreInfo.usuario_nick,
                        puntuacion_ia: scoreInfo.puntuacion_ia,
                        titulo: scoreInfo.titulo,
                        is_karaoke: scoreInfo.is_karaoke
                    };

                    console.log('🏆 Puntaje guardado para mostrar en transición:', lastSongScore);

                    // Marcar que el puntaje está listo
                    scoreReadyForTransition = true;

                    // Si hay una transición pendiente, mostrarla ahora
                    if (pendingTransition && !transitionInProgress) {
                        console.log('✅ Puntaje recibido, mostrando transición pendiente');
                        if (transitionTimeout) {
                            clearTimeout(transitionTimeout);
                            transitionTimeout = null;
                        }
                        showTransitionScreen();
                    }
                }

                // 4. Notificaciones globales
                if (data.type === 'notification' && data.payload && data.payload.mensaje) {
                    notificationBanner.textContent = data.payload.mensaje;
                    notificationBanner.classList.add('show');

                    // Ocultar el banner después de 10 segundos
                    setTimeout(() => {
                        notificationBanner.classList.remove('show');
                    }, 10000);
                }

                // 5. Pausar reproducción
                if (data.type === 'pause_playback') {
                    if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
                        ytPlayer.pauseVideo();
                        console.log('⏸️ Video pausado por admin');
                    } else {
                        // Encolar la pausa para aplicarla cuando el reproductor esté listo
                        pendingPause = true;
                        pendingResume = false;
                        console.log('⏳ Pausa encolada hasta inicialización del reproductor (admin solicitó pausar antes de crear el player).');
                    }
                }

                // 6. Reanudar reproducción
                if (data.type === 'resume_playback') {
                    if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                        ytPlayer.playVideo();
                        console.log('▶️ Video reanudado por admin');
                    } else {
                        // Encolar la reanudación para aplicarla cuando el reproductor esté listo
                        pendingResume = true;
                        pendingPause = false;
                        console.log('⏳ Reanudar encolado hasta inicialización del reproductor (admin solicitó reanudar antes de crear el player).');
                    }
                }

                // 7. Reacciones
                if (data.type === 'reaction' && data.payload && data.payload.reaction) {
                    const emoji = document.createElement('div');
                    emoji.className = 'reaction-emoji';
                    emoji.textContent = data.payload.reaction;

                    // Posición horizontal y movimiento lateral aleatorios
                    emoji.style.left = `${Math.random() * 90 + 5}%`;
                    emoji.style.setProperty('--tx', `${(Math.random() - 0.5) * 200}px`);

                    document.getElementById('reaction-container').appendChild(emoji);
                    setTimeout(() => emoji.remove(), 6000); // Limpiar el emoji del DOM después de la animación
                }

                // 8. Actualización explícita de la cola
                if (data.type === 'queue_update') {
                    console.log('📋 Actualización de cola recibida por WebSocket');
                    if (data.payload) {
                        updateQueueUI(data.payload);
                    }
                    return;
                }

                // 9. Fallback para otros tipos de dato
                // Si no es un tipo específico de los anteriores, asumimos que es data de la cola
                if (!['play_song', 'song_finished', 'notification', 'reaction', 'restart_song', 'pause_playback', 'resume_playback', 'queue_update'].includes(data.type)) {
                    updateQueueUI(data);
                }
            };

            socket.onclose = () => {
                console.log('WebSocket desconectado. Reconectando en 3 segundos...');
                setTimeout(connectWebSocket, 3000);
            };

            socket.onerror = (error) => {
                console.error("Error de WebSocket:", error);
                socket.close();
            };
        }

        function updateQueueUI(queueData) {
            // Logging y defensas para evitar que un payload inesperado rompa la UI
            try {
                console.debug('updateQueueUI called with payload:', queueData);

                const nowPlayingInfo = document.getElementById('now-playing-info');
                const upcomingInfo = document.getElementById('upcoming-info');

                // Actualizar "Ahora Cantando"
                if (queueData && queueData.now_playing) {
                    const song = queueData.now_playing;
                    // Protegemos contra estructura inesperada
                    const addedBy = (song && song.usuario) ? (song.usuario.mesa ? song.usuario.mesa.nombre : song.usuario.nick) : 'Desconocido';
                    const title = (song && song.titulo) ? song.titulo : 'Título desconocido';
                    nowPlayingInfo.innerHTML = `
                        <div class="info-title">${title}</div>
                        <div class="info-artist">Por: <strong>${addedBy}</strong></div>`;
                } else {
                    nowPlayingInfo.innerHTML = `<div class="info-title">Esperando canción...</div><div class="info-artist"></div>`;
                }

                // Actualizar "Siguiente" y guardar información para la transición
                if (queueData && queueData.upcoming && queueData.upcoming.length > 0) {
                    const nextSong = queueData.upcoming[0];
                    const addedBy = (nextSong && nextSong.usuario) ? (nextSong.usuario.mesa ? nextSong.usuario.mesa.nombre : nextSong.usuario.nick) : 'Desconocido';

                    // Guardar información de la siguiente canción para mostrar en la transición
                    nextSongInfo = {
                        titulo: nextSong && nextSong.titulo ? nextSong.titulo : 'Título desconocido',
                        cantante: addedBy
                    };

                    upcomingInfo.innerHTML = `
                        <div class="info-title">${nextSongInfo.titulo}</div>
                        <div class="info-artist">Por: <strong>${addedBy}</strong></div>`;
                } else {
                    nextSongInfo = null;
                    upcomingInfo.innerHTML = `<div class="info-title">No hay canciones en espera</div><div class="info-artist"></div>`;
                }
            } catch (e) {
                // No permitimos que un error en la UI detenga el reproductor; logueamos para diagnóstico
                console.error('Error en updateQueueUI:', e, 'payload:', queueData);
            }
        }

        // Iniciar la conexión al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            connectWebSocket();
            startCarousel(); // Inicia el carrusel al cargar la página
        });


    </script>
